<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edb3c9">
  <title>Slice into Christmas</title>

  <script>
    // Kun computer (bred skærm + mus) får telefonrammen.
    // Mobil og tablet sendes direkte til spillet, uden ramme.
    var computer = window.matchMedia(
      "(min-width: 700px) and (hover: hover) and (pointer: fine)"
    ).matches;

    if (!computer) location.replace("spil.html" + location.search + location.hash);
  </script>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;padding:16px;
      background:radial-gradient(circle at 50% 0,#fff6 0,transparent 55%),
                 linear-gradient(180deg,#fbe5f0,#e3b3cb);
      font-family:Roboto,system-ui,sans-serif;
    }
    .phone{
      position:relative;display:flex;flex-direction:column;
      width:390px;height:min(844px,calc(100dvh - 32px));min-height:560px;
      border:11px solid #121212;border-radius:56px;background:#fff;overflow:hidden;
      box-shadow:0 0 0 2px #4a4a4a,0 40px 90px #5a153055;
    }
    .status{
      flex:none;position:relative;display:flex;justify-content:space-between;
      align-items:center;height:48px;padding:6px 28px 0;
      font-weight:700;font-size:14px;color:#121212;background:#fff;
    }
    .island{
      position:absolute;top:9px;left:50%;transform:translateX(-50%);
      width:104px;height:28px;border-radius:20px;background:#121212;
    }
    iframe{flex:1;width:100%;min-height:0;border:0;display:block;background:#fff}
    .home{flex:none;height:22px;background:#fff;display:flex;align-items:center;justify-content:center}
    .home i{width:128px;height:5px;border-radius:3px;background:#121212}
  </style>
</head>

<body>
  <div class="phone">
    <div class="status">
      <span id="clock">10.16</span>
      <div class="island"></div>
      <span>5G&nbsp; ▂▄▆ &nbsp;86</span>
    </div>

    <iframe src="spil.html" title="Slice into Christmas" allow="autoplay; vibrate"></iframe>

    <div class="home"><i></i></div>
  </div>

  <script>
    const clock = document.getElementById("clock");
    const tick = () => {
      const d = new Date();
      clock.textContent = d.getHours() + "." + String(d.getMinutes()).padStart(2, "0");
    };
    tick();
    setInterval(tick, 20000);
  </script>
</body>
</html>
